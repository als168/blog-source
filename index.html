<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保护非洲野生动物</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: url('https://images.unsplash.com/photo-1509316785289-025f5b8b4b22') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
        }
        
        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            min-height: 100vh;
            padding: 20px;
        }
        
        h1 {
            font-size: 3em;
            margin-top: 100px;
            text-shadow: 2px 2px 4px #000;
        }
        
        p {
            font-size: 1.5em;
            max-width: 800px;
            margin: 30px auto;
            line-height: 1.6;
            text-shadow: 1px 1px 2px #000;
        }
        
        .animals {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 50px 0;
        }
        
        .animal {
            margin: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            width: 200px;
            transition: transform 0.3s;
        }
        
        .animal:hover {
            transform: scale(1.05);
        }
        
        .animal img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
        }
        
        .cta-button {
            background: #e67e22;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 30px;
        }
        
        .cta-button:hover {
            background: #d35400;
        }
        
        footer {
            margin-top: 100px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>保护非洲野生动物</h1>
        <p>非洲沙漠是许多珍稀野生动物的家园。由于气候变化和人类活动，它们的生存正面临严重威胁。加入我们，一起保护这些美丽的生灵。</p>
        
        <div class="animals">
            <div class="animal">
                <img src="https://images.unsplash.com/photo-1551969014-7d2c4cddf0b6" alt="非洲狮">
                <h3>非洲狮</h3>
                <p>数量在过去25年减少了43%</p>
            </div>
            <div class="animal">
                <img src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46" alt="非洲象">
                <h3>非洲象</h3>
                <p>每年有约20,000头被非法猎杀</p>
            </div>
            <div class="animal">
                <img src="https://images.unsplash.com/photo-1550358864-518f256c92a3" alt="猎豹">
                <h3>猎豹</h3>
                <p>野外仅存约7,100只</p>
            </div>
        </div>
        
        <button class="cta-button">立即行动</button>
        
        <footer>
            <p>© 2023 非洲野生动物保护组织 | 联系我们: info@saveafricawildlife.org</p>
        </footer>
    </div>
</body>
</html>
